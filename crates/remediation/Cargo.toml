[package]
name = "rustops-remediation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Experimental/design-stage: remediation workflow engine with policy gates, approval flow, circuit breakers, and rollback scaffolding — activities run against a clearly-labeled simulator; no real Kubernetes/cloud executors yet"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Local dependencies
rustops-common = { path = "../common" }

# Kubernetes

# Cloud providers

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
mockall = "0.13"
proptest = { workspace = true }
criterion = { workspace = true }

