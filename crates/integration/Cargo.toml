# Kubernetes
kube = { workspace = true }
k8s-openapi = { workspace = true }

# Encoding and utilities
urlencoding = "2.1"
base64 = "0.22"

# Authentication

# Common types
rustops-common = { path = "../common" }

# Prometheus integration
prometheus = { workspace = true }
prost = "0.12"
