# cargo-audit configuration for the Security Audit CI job (`cargo audit`).
#
# Advisories pinned by the reqwest 0.11 / kube 0.87 / prometheus 0.13
# dependency chains were cleared by migrating to reqwest 0.12, kube 4.2
# and prometheus 0.14 (rustls 0.23 / webpki 0.103 / h2 0.4 / protobuf 3).
# Unmaintained/unsound warnings for other transitive crates are NOT
# ignored: they stay visible in the CI output.
#
# Tracking issue: #15 (closed by this migration).

[advisories]
ignore = []
